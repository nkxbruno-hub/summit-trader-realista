services:
  - type: web
    name: summit-trader-realista
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v27.0
      - key: CHECKOUT_URL
        value: https://www.instagram.com/traderrealista/
